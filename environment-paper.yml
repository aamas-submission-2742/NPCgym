name: npcgym-paper
channels:
  - conda-forge
dependencies:
  - python=3.13.15
  - pip
  - pip:
      # Versions recorded in every retained training run.
      - gymnasium==1.3.0
      - numpy==2.2.6
      - torch==2.14.1
      - stable-baselines3==2.9.0
      - clingo==5.8.2
      # Analysis and verification tools; not training hyperparameters.
      - matplotlib==3.11.2
      - pandas==3.0.6
      - pytest==9.1.1
      - -e .[asp,sb3,plots,test]
